
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | متجر سهام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1>متجر سهام 🌸</h1>
        <p>أهلاً بكِ، سجلي الدخول لإدارة متجرك.</p>

        <form id="loginForm">
            <label for="username">اسم المستخدم</label>
            <input id="username" name="username" required placeholder="اكتبي أي اسم">

            <label for="password">كلمة المرور</label>
            <input id="password" name="password" type="password" required placeholder="اكتبي أي كلمة مرور">

            <button type="submit" class="btn">تسجيل الدخول</button>
        </form>

        <a class="back-link" href="Store.html">الرجوع للمتجر</a>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            if (username && password) {
                window.location.href = "./index.html";
            }
        });
    </script>
</body>
</html>
